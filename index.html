<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>くりえいてぃ部 運営ページ</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #191c22; --panel-2: #21252d;
      --text: #e7e9ee; --muted: #9aa2ad; --line: #2c313b; --accent: #5b8bf0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6;
    }
    .topbar { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    main { padding: 24px; max-width: 760px; margin: 0 auto; }
    .nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .nav-card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: var(--text);
      transition: border-color .12s, transform .12s;
    }
    .nav-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .nav-icon { font-size: 26px; line-height: 1; }
    .nav-title { margin: 10px 0 4px; font-size: 17px; font-weight: 600; }
    .nav-desc { margin: 0; color: var(--muted); font-size: 13px; }
    .nav-count {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--panel-2);
      font-variant-numeric: tabular-nums;
    }
    .nav-arrow { float: right; color: var(--muted); font-size: 18px; }
    .nav-card:hover .nav-arrow { color: var(--accent); }
    .foot { margin-top: 28px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>くりえいてぃ部 運営ページ</h1>
    <p class="subtitle">運営向けの閲覧ページ集（メンバーの確認とお知らせの確認）</p>
  </header>

  <main>
    <nav class="nav">
      <a class="nav-card" href="dashboard/">
        <span class="nav-arrow">→</span>
        <div class="nav-icon">👥</div>
        <div class="nav-title">メンバー一覧</div>
        <p class="nav-desc">支援者・スタッフ・管理者権限の確認と、データの自動チェック。</p>
        <span class="nav-count" id="members-count">読み込み中…</span>
      </a>

      <a class="nav-card" href="Announcements/">
        <span class="nav-arrow">→</span>
        <div class="nav-icon">📢</div>
        <div class="nav-title">お知らせ一覧</div>
        <p class="nav-desc">ワールドのメニュー「お知らせ」タブに表示中の内容を確認。</p>
        <span class="nav-count" id="announcements-count">読み込み中…</span>
      </a>
    </nav>

    <p class="foot">このページは運営向けの閲覧専用です（検索エンジンには登録されません）。</p>
  </main>

  <script>
    "use strict";
    const OWNER = "vrccreative", REPO = "Contents", BRANCH = "main";
    const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

    // 相対 → raw フォールバックで JSON を取得（file:// でも動く）
    async function loadJson(path) {
      try {
        const r = await fetch(path, { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (_) { /* file:// は raw へ */ }
      const r2 = await fetch(`${RAW}/${path}`, { cache: "no-store" });
      if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
      return await r2.json();
    }

    function setCount(id, text) {
      const e = document.getElementById(id);
      if (e) e.textContent = text;
    }

    (async () => {
      try {
        const u = await loadJson("Users/v2/users.json");
        const credits = Array.isArray(u.fanbox_credits) ? u.fanbox_credits.length : 0;
        const staff = Array.isArray(u.staff) ? u.staff.length : 0;
        setCount("members-count", `支援者 ${credits} 名・スタッフ ${staff} 名`);
      } catch (_) {
        setCount("members-count", "件数を取得できませんでした");
      }
      try {
        const a = await loadJson("Announcements/v1/announcements.json");
        const n = a && Array.isArray(a.items) ? a.items.length : 0;
        setCount("announcements-count", `${n} 件を公開中`);
      } catch (_) {
        setCount("announcements-count", "件数を取得できませんでした");
      }
    })();
  </script>
</body>
</html>
